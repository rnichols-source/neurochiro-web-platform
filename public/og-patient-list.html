<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    background: #1E2D3B;
    font-family: system-ui, -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .bg-glow {
    position: absolute;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(214,104,41,0.15) 0%, transparent 70%);
    top: -100px;
    right: -100px;
  }
  .content {
    text-align: center;
    z-index: 1;
    max-width: 900px;
    padding: 60px;
  }
  .logo {
    font-size: 28px;
    font-weight: 900;
    color: white;
    letter-spacing: 2px;
    margin-bottom: 40px;
  }
  .logo span { color: #D66829; }
  h1 {
    font-size: 56px;
    font-weight: 900;
    color: white;
    line-height: 1.2;
    margin-bottom: 20px;
  }
  h1 span { color: #D66829; }
  p {
    font-size: 22px;
    color: rgba(255,255,255,0.5);
    line-height: 1.5;
  }
  .badge {
    display: inline-block;
    background: rgba(214,104,41,0.2);
    color: #D66829;
    font-size: 13px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    padding: 8px 20px;
    border-radius: 100px;
    margin-bottom: 24px;
  }
</style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="content">
    <div class="logo">NEURO<span>CHIRO</span></div>
    <div class="badge">Patient List</div>
    <h1>No Doctor Near You <span>Yet?</span></h1>
    <p>Join the list. Weekly nervous system education + alerts when a doctor joins your area.</p>
  </div>
</body>
</html>
