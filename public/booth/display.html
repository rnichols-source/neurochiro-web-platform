<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100vw; height: 100vh; overflow: hidden;
  background: #0A0E1A;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color: #F5F3EF;
  cursor: none;
}
body {
  background: radial-gradient(ellipse at 50% 50%, #12172a 0%, #0A0E1A 70%);
}
.slide {
  position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transform: scale(0.98);
  transition: opacity 500ms ease, transform 500ms ease;
  pointer-events: none;
  will-change: opacity, transform;
}
.slide.active {
  opacity: 1; transform: scale(1);
  pointer-events: auto;
}

/* SLIDE 1 */
.slide1-inner {
  text-align: center;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.big-number {
  font-size: 40vh; font-weight: 900; line-height: 0.9;
  letter-spacing: -0.02em;
  background: linear-gradient(180deg, #F5F3EF 0%, #b8c4d4 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.sub-line {
  font-size: 4vh; font-weight: 400; margin-top: 3vh;
  color: #F5F3EF; line-height: 1.3;
}
.sub-line-dim {
  font-size: 3vh; font-weight: 300; margin-top: 1.5vh;
  color: rgba(245, 243, 239, 0.55);
}

/* SLIDE 2 */
.slide2-inner {
  width: 100vw; height: 100vh;
  display: flex; flex-direction: row; align-items: stretch;
  position: relative;
}
.map-area {
  flex: 1; position: relative; display: flex; align-items: center; justify-content: center;
}
.map-container {
  position: relative;
  width: 55vh; height: 90vh;
}
.map-container svg {
  width: 100%; height: 100%;
}
.dot {
  opacity: 0; transform-origin: center;
  transition: opacity 400ms ease, transform 400ms ease;
}
.dot.visible {
  opacity: 1;
}
.london-cluster {
  opacity: 0;
  transition: opacity 400ms ease, transform 400ms ease;
}
.london-cluster.visible { opacity: 1; }
.london-cluster text {
  font-family: 'Inter', sans-serif; font-weight: 700;
  fill: #F5F3EF;
}
.birmingham-label {
  opacity: 0;
  transition: opacity 400ms ease;
}
.birmingham-label.visible { opacity: 1; }
.birmingham-label text {
  font-family: 'Inter', sans-serif; font-weight: 600;
  fill: #F5F3EF;
}
.sidebar {
  width: 28vw; padding: 5vh 3vw;
  display: flex; flex-direction: column; justify-content: center;
}
.sidebar h3 {
  font-size: 2.2vh; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.15em; color: rgba(245,243,239,0.5);
  margin-bottom: 3vh;
}
.city-row {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 1.4vh 0;
  border-bottom: 1px solid rgba(245,243,239,0.08);
  font-size: 2.8vh;
}
.city-row .city-name { font-weight: 400; }
.city-row .city-count { font-weight: 700; color: #4A90D9; }
.running-total {
  position: absolute; bottom: 4vh; left: 4vw;
  font-size: 3.5vh; font-weight: 300;
  color: rgba(245,243,239,0.6);
}
.running-total span {
  font-weight: 700; color: #4A90D9; font-size: 4.5vh;
}

/* SLIDE 3 */
.slide3-inner {
  text-align: center;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 100vh; width: 100vw; position: relative;
}
.ask-headline {
  font-size: 5.5vh; font-weight: 600; line-height: 1.2;
  max-width: 80vw; margin-bottom: 5vh;
  font-style: italic;
  color: rgba(245,243,239,0.9);
}
#qr-canvas {
  width: min(35vh, 35vw); height: min(35vh, 35vw);
  image-rendering: pixelated;
}
.qr-label {
  font-size: 3.5vh; font-weight: 600; margin-top: 3vh;
}
.qr-price {
  font-size: 3vh; font-weight: 400; margin-top: 1.5vh;
  color: rgba(245,243,239,0.7);
}
.bottom-info {
  position: absolute; bottom: 3vh; right: 4vw;
  text-align: right; font-size: 2.2vh; font-weight: 300;
  color: rgba(245,243,239,0.4);
  line-height: 1.6;
}
</style>
</head>

</div>

// ===== CITY COUNTING =====
function isLondon(city) {
  const c = city.toLowerCase();
  return c === 'london' || c === 'greater london' || c === 'city of westminster';
}

function isBirmingham(city) {
  return city.toLowerCase() === 'birmingham';
}

// Normalize city names for counting
function normalizeCity(city) {
  if (isLondon(city)) return 'London';
  if (city.toLowerCase() === 'glasgow city' || city.toLowerCase() === 'glasgow') return 'Glasgow';
  if (city.toLowerCase() === 'city of nottingham' || city.toLowerCase() === 'nottingham') return 'Nottingham';
  if (city.toLowerCase() === 'city of leicester') return 'Leicester';
  if (city.toLowerCase() === 'kernow / cornwall' || city.toLowerCase() === 'cornwall') return 'Cornwall';
  if (city.toLowerCase() === 'united kingdom' || city.toLowerCase() === 'uk' || city.toLowerCase() === 'united') return null;
  return city;
}

const cityCounts = {};
DEMAND_DATA.forEach(d => {
  const norm = normalizeCity(d.city);
  if (norm) cityCounts[norm] = (cityCounts[norm] || 0) + 1;
});

// ===== PROJECTION =====
const LAT_MIN = 49.5, LAT_MAX = 59.0;
const LNG_MIN = -8.5, LNG_MAX = 2.2;

function projectLat(lat) {
  // Mercator Y
  const latRad = lat * Math.PI / 180;
  const mercY = Math.log(Math.tan(Math.PI / 4 + latRad / 2));
  const minRad = LAT_MIN * Math.PI / 180;
  const maxRad = LAT_MAX * Math.PI / 180;
  const mercMin = Math.log(Math.tan(Math.PI / 4 + minRad / 2));
  const mercMax = Math.log(Math.tan(Math.PI / 4 + maxRad / 2));
  return 1 - (mercY - mercMin) / (mercMax - mercMin); // 0=top, 1=bottom
}

function projectLng(lng) {
  return (lng - LNG_MIN) / (LNG_MAX - LNG_MIN);
}

// ===== DETERMINISTIC JITTER for approximate rows =====
function seededRandom(seed) {
  let x = Math.sin(seed * 127.1 + seed * 311.7) * 43758.5453;
  return x - Math.floor(x);
}

// ===== MAP ANIMATION =====
let mapAnimationTimer = null;
let mapAnimated = false;

function animateMap() {
  const { allDotEls, totalCount, londonCount } = mapData;
  const countEl = document.getElementById('runningCount');
  let currentCount = 0;
  const totalDuration = 5000; // 5 seconds
  const perDot = totalDuration / allDotEls.length;

  // Reset
  allDotEls.forEach(d => {
    d.el.classList.remove('visible');
    d.el.style.transform = 'scale(0.8)';
  });
  countEl.textContent = '0';

  allDotEls.forEach((d, i) => {
    setTimeout(() => {
      d.el.classList.add('visible');
      d.el.style.transform = 'scale(1)';
      if (d.isLondon) {
        currentCount += londonCount;
      } else if (d.isBirmingham) {
        // Birmingham dots counted individually
      } else {
        currentCount++;
      }
      // Smooth counter
      countEl.textContent = Math.min(currentCount, totalCount);
    }, i * perDot);
  });

  // Final count correction
  setTimeout(() => {
    countEl.textContent = totalCount;
  }, totalDuration + 200);
}

function resetMap() {
  const { allDotEls } = mapData;
  allDotEls.forEach(d => {
    d.el.classList.remove('visible');
    d.el.style.transform = 'scale(0.8)';
  });
  document.getElementById('runningCount').textContent = '0';
  mapAnimated = false;
}

// Minimal QR Code generator for alphanumeric data (version 2, EC level L)
(function() {
  // This is a compact QR code implementation
  function generateQR(text) {
    // We'll use a simple approach: build the QR matrix using Reed-Solomon and masking
    // For a short URL, Version 2-L (25x25) is sufficient
    // Since embedding a full RS encoder is complex, we use a lookup-based approach
    // for this specific URL

    // Actually, let's embed a minimal but complete QR generator
    const QRCode = (function() {
      // Galois field math for GF(256)
      const EXP = new Uint8Array(256);
      const LOG = new Uint8Array(256);
      let val = 1;
      for (let i = 0; i < 255; i++) {
        EXP[i] = val;
        LOG[val] = i;
        val <<= 1;
        if (val >= 256) val ^= 285;
      }
      EXP[255] = EXP[0];

      function gfMul(a, b) {
        if (a === 0 || b === 0) return 0;
        return EXP[(LOG[a] + LOG[b]) % 255];
      }

      function polyMul(p1, p2) {
        const r = new Uint8Array(p1.length + p2.length - 1);
        for (let i = 0; i < p1.length; i++)
          for (let j = 0; j < p2.length; j++)
            r[i + j] ^= gfMul(p1[i], p2[j]);
        return r;
      }

      function polyRest(dividend, divisor) {
        const result = new Uint8Array(dividend);
        for (let i = 0; i < dividend.length - divisor.length + 1; i++) {
          if (result[i] === 0) continue;
          const coef = result[i];
          for (let j = 0; j < divisor.length; j++)
            result[i + j] ^= gfMul(divisor[j], coef);
        }
        return result.slice(dividend.length - divisor.length + 1);
      }

      function rsGenPoly(n) {
        let p = new Uint8Array([1]);
        for (let i = 0; i < n; i++)
          p = polyMul(p, new Uint8Array([1, EXP[i]]));
        return p;
      }

      function encodeBytes(text) {
        // Byte mode encoding
        const bytes = [];
        for (let i = 0; i < text.length; i++) {
          const c = text.charCodeAt(i);
          if (c < 128) bytes.push(c);
          else if (c < 2048) {
            bytes.push(192 | (c >> 6));
            bytes.push(128 | (c & 63));
          }
        }
        return bytes;
      }

      function create(text) {
        const dataBytes = encodeBytes(text);
        const len = dataBytes.length;

        // Determine version
        // V1-L: 17 bytes, V2-L: 32 bytes, V3-L: 53 bytes
        let version, totalCodewords, ecCodewords, ecBlocks, size;
        if (len <= 14) { version = 1; totalCodewords = 19; ecCodewords = 7; ecBlocks = 1; size = 21; }
        else if (len <= 30) { version = 2; totalCodewords = 34; ecCodewords = 10; ecBlocks = 1; size = 25; }
        else if (len <= 51) { version = 3; totalCodewords = 55; ecCodewords = 15; ecBlocks = 1; size = 29; }
        else { version = 4; totalCodewords = 80; ecCodewords = 20; ecBlocks = 1; size = 33; }

        const bits = [];

        pushBits(4, 4);
        // Character count (8 bits for V1-9 byte mode)
        pushBits(len, 8);
        // Data
        for (let i = 0; i < len; i++) pushBits(dataBytes[i], 8);
        // Terminator
        const totalBits = dataCodewords * 8;
        const termLen = Math.min(4, totalBits - bits.length);
        pushBits(0, termLen);
        // Pad to byte boundary
        while (bits.length % 8 !== 0) bits.push(0);
        // Pad codewords
        const padBytes = [236, 17];
        let padIdx = 0;
        while (bits.length < totalBits) {
          pushBits(padBytes[padIdx % 2], 8);
          padIdx++;
        }

        // Convert bits to bytes
        const data = new Uint8Array(dataCodewords);
        for (let i = 0; i < dataCodewords; i++) {
          let b = 0;
          for (let j = 0; j < 8; j++) b = (b << 1) | (bits[i * 8 + j] || 0);
          data[i] = b;
        }

        // Reed-Solomon
        const gen = rsGenPoly(ecCodewords);
        const msgPoly = new Uint8Array(dataCodewords + ecCodewords);
        msgPoly.set(data);
        const ec = polyRest(msgPoly, gen);

        // Final codewords
        const finalData = new Uint8Array(totalCodewords);
        finalData.set(data);
        finalData.set(ec, dataCodewords);

        // Build matrix
        const matrix = Array.from({ length: size }, () => new Int8Array(size).fill(-1));
        const reserved = Array.from({ length: size }, () => new Uint8Array(size));

        function setModule(r, c, val) {
          if (r >= 0 && r < size && c >= 0 && c < size) {
            matrix[r][c] = val ? 1 : 0;
            reserved[r][c] = 1;
          }
        }

        // Finder patterns
        function finderPattern(row, col) {
          for (let r = -1; r <= 7; r++)
            for (let c = -1; c <= 7; c++) {
              const rr = row + r, cc = col + c;
              if (rr < 0 || rr >= size || cc < 0 || cc >= size) continue;
              const val = (r >= 0 && r <= 6 && (c === 0 || c === 6)) ||
                          (c >= 0 && c <= 6 && (r === 0 || r === 6)) ||
                          (r >= 2 && r <= 4 && c >= 2 && c <= 4);
              setModule(rr, cc, val);
            }
        }

        finderPattern(0, 0);
        finderPattern(0, size - 7);
        finderPattern(size - 7, 0);

        // Alignment pattern (V2+)
        if (version >= 2) {
          const alignPos = version === 2 ? [6, 18] : version === 3 ? [6, 22] : [6, 26];
          for (const ar of alignPos)
            for (const ac of alignPos) {
              if (reserved[ar] && reserved[ar][ac]) continue;
              for (let r = -2; r <= 2; r++)
                for (let c = -2; c <= 2; c++) {
                  const val = Math.abs(r) === 2 || Math.abs(c) === 2 || (r === 0 && c === 0);
                  setModule(ar + r, ac + c, val);
                }
            }
        }

        // Timing patterns
        for (let i = 8; i < size - 8; i++) {
          setModule(6, i, i % 2 === 0);
          setModule(i, 6, i % 2 === 0);
        }

        // Dark module
        setModule(size - 8, 8, 1);

        // Reserve format info areas
        for (let i = 0; i < 8; i++) {
          if (!reserved[8][i]) { reserved[8][i] = 1; matrix[8][i] = 0; }
          if (!reserved[8][size - 1 - i]) { reserved[8][size - 1 - i] = 1; matrix[8][size - 1 - i] = 0; }
          if (!reserved[i][8]) { reserved[i][8] = 1; matrix[i][8] = 0; }
          if (!reserved[size - 1 - i][8]) { reserved[size - 1 - i][8] = 1; matrix[size - 1 - i][8] = 0; }
        }
        if (!reserved[8][8]) { reserved[8][8] = 1; matrix[8][8] = 0; }

        // Version info (V7+) - not needed for V1-4

        // Place data
        const allBits = [];
        for (let i = 0; i < finalData.length; i++)
          for (let j = 7; j >= 0; j--)
            allBits.push((finalData[i] >> j) & 1);

        let bitIdx = 0;
        for (let col = size - 1; col >= 1; col -= 2) {
          if (col === 6) col = 5; // Skip timing
          for (let cnt = 0; cnt < size; cnt++) {
            const up = ((Math.floor((size - 1 - col) / 2)) % 2 === 0);
            const row = up ? size - 1 - cnt : cnt;
            for (let dc = 0; dc <= 1; dc++) {
              const c = col - dc;
              if (c < 0 || c >= size) continue;
              if (reserved[row][c]) continue;
              matrix[row][c] = bitIdx < allBits.length ? allBits[bitIdx] : 0;
              bitIdx++;
            }
          }
        }

        // Masking - try mask 0 (checkerboard)
        function applyMask(matrix, mask) {
          const m = matrix.map(r => new Int8Array(r));
          for (let r = 0; r < size; r++)
            for (let c = 0; c < size; c++) {
              if (reserved[r][c]) continue;
              let flip = false;
              switch (mask) {
                case 0: flip = (r + c) % 2 === 0; break;
                case 1: flip = r % 2 === 0; break;
                case 2: flip = c % 3 === 0; break;
                case 3: flip = (r + c) % 3 === 0; break;
                case 4: flip = (Math.floor(r/2) + Math.floor(c/3)) % 2 === 0; break;
                case 5: flip = (r*c)%2 + (r*c)%3 === 0; break;
                case 6: flip = ((r*c)%2 + (r*c)%3) % 2 === 0; break;
                case 7: flip = ((r+c)%2 + (r*c)%3) % 2 === 0; break;
              }
              if (flip) m[r][c] ^= 1;
            }
          return m;
        }

        // Simple penalty scoring
        function penalty(m) {
          let score = 0;
          for (let r = 0; r < size; r++) {
            let run = 1;
            for (let c = 1; c < size; c++) {
              if (m[r][c] === m[r][c-1]) { run++; if (run === 5) score += 3; else if (run > 5) score++; }
              else run = 1;
            }
          }
          for (let c = 0; c < size; c++) {
            let run = 1;
            for (let r = 1; r < size; r++) {
              if (m[r][c] === m[r-1][c]) { run++; if (run === 5) score += 3; else if (run > 5) score++; }
              else run = 1;
            }
          }
          return score;
        }

        // Try all masks, pick best
        let bestMask = 0, bestScore = Infinity;
        for (let mask = 0; mask < 8; mask++) {
          const masked = applyMask(matrix, mask);
          const s = penalty(masked);
          if (s < bestScore) { bestScore = s; bestMask = mask; }
        }

        const finalMatrix = applyMask(matrix, bestMask);

        // Format info
        // EC level L = 01, mask pattern
        const formatData = (1 << 3) | bestMask; // 01 xxx
        // BCH encoding for format info
        let fmt = formatData << 10;
        let gen2 = 0b10100110111;
        for (let i = 14; i >= 10; i--) {
          if (fmt & (1 << i)) fmt ^= gen2 << (i - 10);
        }
        fmt = ((formatData << 10) | fmt) ^ 0b101010000010010;

        // Place format bits
        const formatBits = [];
        for (let i = 14; i >= 0; i--) formatBits.push((fmt >> i) & 1);

        // Around top-left finder
        const positions1 = [
          [8,0],[8,1],[8,2],[8,3],[8,4],[8,5],[8,7],[8,8],
          [7,8],[5,8],[4,8],[3,8],[2,8],[1,8],[0,8]
        ];
        const positions2 = [
          [size-1,8],[size-2,8],[size-3,8],[size-4,8],[size-5,8],[size-6,8],[size-7,8],
          [8,size-8],[8,size-7],[8,size-6],[8,size-5],[8,size-4],[8,size-3],[8,size-2],[8,size-1]
        ];

        for (let i = 0; i < 15; i++) {
          const bit = formatBits[i];
          finalMatrix[positions1[i][0]][positions1[i][1]] = bit;
          finalMatrix[positions2[i][0]][positions2[i][1]] = bit;
        }

        return { matrix: finalMatrix, size };
      }

      return { create };
    })();

    return QRCode.create(text);
  }

  function drawQR(canvasId, text, fgColor, bgColor) {
    const { matrix, size } = generateQR(text);
    const canvas = document.getElementById(canvasId);
    const scale = 16; // pixels per module
    const quiet = 4; // quiet zone modules
    const totalSize = (size + quiet * 2) * scale;
    canvas.width = totalSize;
    canvas.height = totalSize;
    const ctx = canvas.getContext('2d');

    // Background
    ctx.fillStyle = bgColor || '#F5F3EF';
    ctx.fillRect(0, 0, totalSize, totalSize);

    // Modules
    ctx.fillStyle = fgColor || '#0A0E1A';
    for (let r = 0; r < size; r++) {
      for (let c = 0; c < size; c++) {
        if (matrix[r][c] === 1) {
          ctx.fillRect((c + quiet) * scale, (r + quiet) * scale, scale, scale);
        }
      }
    }
  }

  window.drawQR = drawQR;
})();

// Generate QR
drawQR('qr-canvas', 'https://neurochiro.co/uk', '#0A0E1A', '#F5F3EF');

// ===== SLIDESHOW ENGINE =====
const slides = [
  { el: document.getElementById('slide1'), duration: 6000 },
  { el: document.getElementById('slide2'), duration: 12000 },
  { el: document.getElementById('slide3'), duration: 8000 }
];

let currentSlide = 0;
let paused = false;
let autoTimer = null;

function showSlide(idx) {
  slides.forEach((s, i) => {
    s.el.classList.toggle('active', i === idx);
  });
  currentSlide = idx;

  // Trigger map animation when slide 2 becomes active
  if (idx === 1) {
    resetMap();
    setTimeout(animateMap, 300);
  }
}

function nextSlide() {
  showSlide((currentSlide + 1) % slides.length);
  scheduleNext();
}

function prevSlide() {
  showSlide((currentSlide - 1 + slides.length) % slides.length);
  if (!paused) scheduleNext();
}

function scheduleNext() {
  clearTimeout(autoTimer);
  if (!paused) {
    autoTimer = setTimeout(nextSlide, slides[currentSlide].duration);
  }
}

// Start
scheduleNext();

// ===== CONTROLS =====
document.addEventListener('keydown', function(e) {
  if (e.code === 'Space') {
    e.preventDefault();
    paused = !paused;
    if (!paused) scheduleNext();
    else clearTimeout(autoTimer);
  } else if (e.code === 'ArrowRight') {
    e.preventDefault();
    clearTimeout(autoTimer);
    showSlide((currentSlide + 1) % slides.length);
    if (!paused) scheduleNext();
  } else if (e.code === 'ArrowLeft') {
    e.preventDefault();
    clearTimeout(autoTimer);
    prevSlide();
  }
});
</script>
