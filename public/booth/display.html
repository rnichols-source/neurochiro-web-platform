<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeuroChiro UK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --navy: #1E2D3B;
  --orange: #D66829;
  --black: #131313;
  --cream: #F5F3EF;
  --gray: #4B5563;
}

html, body {
  width: 100vw; height: 100vh; overflow: hidden;
  background: var(--black);
  color: var(--cream);
  cursor: none;
  font-family: 'Montserrat', -apple-system, sans-serif;
}

body {
  background:
    radial-gradient(circle at 1px 1px, rgba(245,243,239,0.03) 1px, transparent 0) 0 0 / 30px 30px,
    var(--black);
}

/* ── PERSISTENT CHROME ── */
.chrome-header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; justify-content: space-between; align-items: flex-start;
  padding: 2.5vh 3vw;
  pointer-events: none;
}
.brand-lockup {
  font-family: 'Lato', sans-serif;
  font-weight: 700;
  font-size: 2vh;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: rgba(245,243,239,0.6);
  line-height: 1.3;
}
.brand-lockup span { display: block; }
.handle {
  font-family: 'Montserrat', sans-serif;
  font-weight: 400;
  font-size: 1.8vh;
  color: var(--gray);
  padding-top: 0.5vh;
}

.progress-bar {
  position: fixed; bottom: 0; left: 0; z-index: 100;
  width: 100vw; height: 6px;
  background: rgba(30,45,59,0.5);
}
.progress-fill {
  height: 100%; width: 0%;
  background: var(--orange);
  transition: none;
}

/* ── SLIDES ── */
.slide {
  position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transform: scale(0.98);
  transition: opacity 500ms ease, transform 500ms ease;
  pointer-events: none;
  will-change: opacity, transform;
}
.slide.active { opacity: 1; transform: scale(1); pointer-events: auto; }

/* ── SLIDE 1: THE NUMBER ── */
.s1-bg {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: radial-gradient(ellipse at 50% 45%, var(--navy) 0%, var(--black) 65%);
  animation: ambientDrift 20s ease-in-out infinite alternate;
}
@keyframes ambientDrift {
  0%   { background-position: 50% 45%; }
  50%  { background-position: 48% 48%; }
  100% { background-position: 52% 43%; }
}
.s1-inner {
  position: relative; z-index: 1;
  text-align: center;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.big-number-wrap { position: relative; }
.big-number-glow {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 60vw; height: 40vh;
  background: radial-gradient(ellipse, rgba(214,104,41,0.15) 0%, transparent 70%);
  filter: blur(40px);
  pointer-events: none;
}
.big-number {
  position: relative;
  font-family: 'Lato', sans-serif;
  font-size: 40vh; font-weight: 900; line-height: 0.85;
  letter-spacing: -0.04em;
  color: var(--cream);
  text-shadow: 0 0 80px rgba(214,104,41,0.3), 0 0 160px rgba(214,104,41,0.15);
}
.orange-rule {
  width: 200px; height: 4px;
  background: var(--orange);
  border: none; border-radius: 2px;
  margin: 3vh auto 0;
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 0.5s ease, transform 0.5s ease;
}
.orange-rule.show { opacity: 1; transform: translateY(0); }
.sub-line {
  font-family: 'Montserrat', sans-serif;
  font-size: 4vh; font-weight: 500; margin-top: 3vh;
  color: var(--cream); line-height: 1.3;
  opacity: 0; transform: translateY(20px);
  transition: opacity 0.6s ease, transform 0.6s ease;
}
.sub-line.show { opacity: 1; transform: translateY(0); }
.sub-line-dim {
  font-family: 'Montserrat', sans-serif;
  font-size: 3vh; font-weight: 400; margin-top: 1.5vh;
  color: var(--gray); line-height: 1.3;
  opacity: 0; transform: translateY(20px);
  transition: opacity 0.6s ease, transform 0.6s ease;
}
.sub-line-dim.show { opacity: 1; transform: translateY(0); }

/* ── SLIDE 2: MAP ── */
.s2-bg {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: radial-gradient(ellipse at 40% 50%, rgba(30,45,59,0.6) 0%, var(--black) 70%);
}
.slide2-inner {
  position: relative; z-index: 1;
  width: 100vw; height: 100vh;
  display: flex; flex-direction: row; align-items: stretch;
}
.map-area {
  flex: 1; position: relative; display: flex; align-items: center; justify-content: center;
}
.map-container {
  position: relative; width: 55vh; height: 88vh; margin-top: 4vh;
}
.map-container svg { width: 100%; height: 100%; }
.dot {
  opacity: 0; transform-origin: center;
  transition: opacity 400ms ease, transform 400ms ease;
}
.dot.visible { opacity: 1; }
.london-cluster { opacity: 0; transition: opacity 400ms ease, transform 400ms ease; }
.london-cluster.visible { opacity: 1; }
.london-cluster text { font-family: 'Lato', sans-serif; font-weight: 700; }
.birmingham-label { opacity: 0; transition: opacity 400ms ease; }
.birmingham-label.visible { opacity: 1; }
.birmingham-label text { font-family: 'Montserrat', sans-serif; font-weight: 600; }
.sidebar {
  width: 28vw; padding: 12vh 3vw 5vh;
  display: flex; flex-direction: column; justify-content: center;
}
.sidebar h3 {
  font-family: 'Lato', sans-serif;
  font-size: 2vh; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.15em; color: var(--gray);
  margin-bottom: 3vh;
}
.city-row {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 1.4vh 0;
  border-bottom: 1px solid rgba(245,243,239,0.06);
  font-size: 2.6vh;
  font-family: 'Montserrat', sans-serif;
}
.city-row .city-name { font-weight: 400; color: var(--cream); }
.city-row .city-count { font-weight: 600; color: var(--orange); font-family: 'Lato', sans-serif; }
.running-total {
  position: absolute; bottom: 5vh; left: 4vw;
  font-family: 'Montserrat', sans-serif;
  font-size: 3vh; font-weight: 400; color: var(--gray);
}
.running-total span {
  font-family: 'Lato', sans-serif;
  font-weight: 700; color: var(--orange); font-size: 4vh;
}

/* ── SLIDE 3: THE ASK ── */
.s3-bg {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: radial-gradient(ellipse at 50% 40%, rgba(30,45,59,0.5) 0%, var(--black) 65%);
}
.slide3-inner {
  position: relative; z-index: 1;
  text-align: center;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 100vh; width: 100vw;
}
.s3-accent-line {
  width: 80px; height: 3px; background: var(--orange); border-radius: 2px;
  margin-bottom: 3vh;
}
.ask-headline {
  font-family: 'Lato', sans-serif;
  font-size: 5.5vh; font-weight: 700; line-height: 1.2;
  max-width: 80vw; margin-bottom: 5vh;
  font-style: italic;
  color: var(--cream);
}
.qr-card {
  background: var(--cream); border-radius: 16px;
  padding: 2vh; display: inline-block;
}
#qr-canvas {
  width: min(32vh, 32vw); height: min(32vh, 32vw);
  image-rendering: pixelated;
  display: block;
}
.qr-label {
  font-family: 'Montserrat', sans-serif;
  font-size: 3.5vh; font-weight: 500; margin-top: 3vh;
  color: var(--cream);
}
.qr-price {
  font-family: 'Lato', sans-serif;
  font-size: 4vh; font-weight: 900; margin-top: 1.5vh;
  color: var(--orange);
}
.bottom-info {
  position: absolute; bottom: 4vh; right: 4vw;
  text-align: right;
  font-family: 'Montserrat', sans-serif;
  font-size: 2vh; font-weight: 400;
  color: var(--gray);
  line-height: 1.6;
}
</style>
</head>

// ===== SLIDE 1: COUNT-UP ANIMATION =====
let s1Animated = false;
function animateSlide1() {
  if (s1Animated) return;
  s1Animated = true;
  const el = document.getElementById('heroNumber');
  const target = 139;
  const duration = 1200;
  const start = performance.now();

  function tick(now) {
    const t = Math.min((now - start) / duration, 1);
    const eased = 1 - Math.pow(1 - t, 3); // ease-out cubic
    el.textContent = Math.round(eased * target);
    if (t < 1) requestAnimationFrame(tick);
    else {
      el.textContent = target;
      // Stagger the reveal
      setTimeout(() => document.getElementById('orangeRule').classList.add('show'), 100);
      setTimeout(() => document.getElementById('subLine1').classList.add('show'), 250);
      setTimeout(() => document.getElementById('subLine2').classList.add('show'), 400);
    }
  }
  requestAnimationFrame(tick);
}

function resetSlide1() {
  s1Animated = false;
  document.getElementById('heroNumber').textContent = '0';
  document.getElementById('orangeRule').classList.remove('show');
  document.getElementById('subLine1').classList.remove('show');
  document.getElementById('subLine2').classList.remove('show');
}

// ===== CITY COUNTING =====
function isLondon(city) {
  const c = city.toLowerCase();
  return c === 'london' || c === 'greater london' || c === 'city of westminster';
}
function isBirmingham(city) { return city.toLowerCase() === 'birmingham'; }
function normalizeCity(city) {
  if (isLondon(city)) return 'London';
  if (city.toLowerCase() === 'glasgow city' || city.toLowerCase() === 'glasgow') return 'Glasgow';
  if (city.toLowerCase() === 'city of nottingham' || city.toLowerCase() === 'nottingham') return 'Nottingham';
  if (city.toLowerCase() === 'city of leicester') return 'Leicester';
  if (city.toLowerCase() === 'kernow / cornwall' || city.toLowerCase() === 'cornwall') return 'Cornwall';
  if (city.toLowerCase() === 'united kingdom' || city.toLowerCase() === 'uk' || city.toLowerCase() === 'united') return null;
  return city;
}

const cityCounts = {};
DEMAND_DATA.forEach(d => { const n = normalizeCity(d.city); if (n) cityCounts[n] = (cityCounts[n] || 0) + 1; });
const londonCount = cityCounts['London'] || 0;
const birminghamCount = cityCounts['Birmingham'] || 0;
const topCities = Object.entries(cityCounts).sort((a,b) => b[1] - a[1]).slice(0, 8);
const topCitiesEl = document.getElementById('topCities');
topCities.forEach(([name, count]) => {
  const row = document.createElement('div');
  row.className = 'city-row';
  row.innerHTML = '<span class="city-name">' + name + '</span><span class="city-count">' + count + '</span>';
  topCitiesEl.appendChild(row);
});

// ===== PROJECTION =====
const LAT_MIN = 49.5, LAT_MAX = 59.0, LNG_MIN = -8.5, LNG_MAX = 2.2;
function projectLat(lat) {
  const r = lat * Math.PI / 180;
  const mY = Math.log(Math.tan(Math.PI/4 + r/2));
  const mMin = Math.log(Math.tan(Math.PI/4 + LAT_MIN*Math.PI/360));
  const mMax = Math.log(Math.tan(Math.PI/4 + LAT_MAX*Math.PI/360));
  return 1 - (mY - mMin) / (mMax - mMin);
}
function projectLng(lng) { return (lng - LNG_MIN) / (LNG_MAX - LNG_MIN); }
function seededRandom(seed) { let x = Math.sin(seed*127.1+seed*311.7)*43758.5453; return x - Math.floor(x); }

  const {allEls, total, londonCount} = mapData;

  let cur = 0;
  const dur = 5000, per = dur / allEls.length;
  allEls.forEach(d => { d.el.classList.remove('visible'); d.el.style.transform = 'scale(0.8)'; });
  cEl.textContent = '0';
  allEls.forEach((d,i) => {
    setTimeout(() => {
      d.el.classList.add('visible'); d.el.style.transform = 'scale(1)';
      if (d.isL) cur += londonCount; else if (!d.isB) cur++;
      cEl.textContent = Math.min(cur, total);
    }, i * per);
  });
  setTimeout(() => { cEl.textContent = total; }, dur + 200);
}

function resetMap() {
  mapData.allEls.forEach(d => { d.el.classList.remove('visible'); d.el.style.transform = 'scale(0.8)'; });
  document.getElementById('runningCount').textContent = '0';
}

// ===== QR CODE =====
(function(){

st gen=rsGenPoly(ecCodewords);const msgPoly=new Uint8Array(dataCodewords+ecCodewords);msgPoly.set(data);const ec=polyRest(msgPoly,gen);const finalData=new Uint8Array(totalCodewords);finalData.set(data);finalData.set(ec,dataCodewords);const matrix=Array.from({length:size},()=>new Int8Array(size).fill(-1));const reserved=Array.from({length:size},()=>new Uint8Array(size));function setMod(r,c,v){if(r>=0&&r<size&&c>=0&&c<size){matrix[r][c]=v?1:0;reserved[r][c]=1;}}function finder(row,col){for(let r=-1;r<=7;r++)for(let c=-1;c<=7;c++){const rr=row+r,cc=col+c;if(rr<0||rr>=size||cc<0||cc>=size)continue;const v=(r>=0&&r<=6&&(c===0||c===6))||(c>=0&&c<=6&&(r===0||r===6))||(r>=2&&r<=4&&c>=2&&c<=4);setMod(rr,cc,v);}}finder(0,0);finder(0,size-7);finder(size-7,0);if(version>=2){const ap=version===2?[6,18]:version===3?[6,22]:[6,26];for(const ar of ap)for(const ac of ap){if(reserved[ar]&&reserved[ar][ac])continue;for(let r=-2;r<=2;r++)for(let c=-2;c<=2;c++){setMod(ar+r,ac+c,Math.abs(r)===2||Math.abs(c)===2||(r===0&&c===0));}}}for(let i=8;i<size-8;i++){setMod(6,i,i%2===0);setMod(i,6,i%2===0);}setMod(size-8,8,1);for(let i=0;i<8;i++){if(!reserved[8][i]){reserved[8][i]=1;matrix[8][i]=0;}if(!reserved[8][size-1-i]){reserved[8][size-1-i]=1;matrix[8][size-1-i]=0;}if(!reserved[i][8]){reserved[i][8]=1;matrix[i][8]=0;}if(!reserved[size-1-i][8]){reserved[size-1-i][8]=1;matrix[size-1-i][8]=0;}}if(!reserved[8][8]){reserved[8][8]=1;matrix[8][8]=0;}const allBits=[];for(let i=0;i<finalData.length;i++)for(let j=7;j>=0;j--)allBits.push((finalData[i]>>j)&1);let bi=0;for(let col=size-1;col>=1;col-=2){if(col===6)col=5;for(let cnt=0;cnt<size;cnt++){const up=((Math.floor((size-1-col)/2))%2===0);const row=up?size-1-cnt:cnt;for(let dc=0;dc<=1;dc++){const c=col-dc;if(c<0||c>=size)continue;if(reserved[row][c])continue;matrix[row][c]=bi<allBits.length?allBits[bi]:0;bi++;}}}function applyMask(mx,mask){const m=mx.map(r=>new Int8Array(r));for(let r=0;r<size;r++)for(let c=0;c<size;c++){if(reserved[r][c])continue;let function drawQR(id,text,fg,bg){const{matrix,size}=generateQR(text);const canvas=document.getElementById(id);const sc=16,q=4,ts=(size+q*2)*sc;canvas.width=ts;canvas.height=ts;const ctx=canvas.getContext('2d');ctx.fillStyle=bg||'#F5F3EF';ctx.fillRect(0,0,ts,ts);ctx.fillStyle=fg||'#131313';for(let r=0;r<size;r++)for(let c=0;c<size;c++){if(matrix[r][c]===1)ctx.fillRect((c+q)*sc,(r+q)*sc,sc,sc);}}

// ===== SLIDESHOW + PROGRESS BAR =====
const slides = [
  {el: document.getElementById('slide1'), duration: 6000},
  {el: document.getElementById('slide2'), duration: 12000},
  {el: document.getElementById('slide3'), duration: 8000}
];
let currentSlide = 0, paused = false, autoTimer = null, progressAnim = null;
const progressFill = document.getElementById('progressFill');

function startProgress(duration) {
  progressFill.style.transition = 'none';
  progressFill.style.width = '0%';
  // Force reflow
  progressFill.offsetWidth;
  progressFill.style.transition = 'width ' + duration + 'ms linear';
  progressFill.style.width = '100%';
}

function showSlide(idx) {
  slides.forEach((s,i) => s.el.classList.toggle('active', i === idx));
  currentSlide = idx;
  startProgress(slides[idx].duration);
  if (idx === 0) { resetSlide1(); setTimeout(animateSlide1, 200); }
  if (idx === 1) { resetMap(); setTimeout(animateMap, 300); }
}

function nextSlide() { showSlide((currentSlide + 1) % slides.length); scheduleNext(); }
function scheduleNext() {
  clearTimeout(autoTimer);
  if (!paused) autoTimer = setTimeout(nextSlide, slides[currentSlide].duration);
}

// Initial
setTimeout(animateSlide1, 300);
startProgress(slides[0].duration);
scheduleNext();

// Controls
document.addEventListener('keydown', function(e) {
  if (e.code === 'Space') {
    e.preventDefault(); paused = !paused;
    if (!paused) scheduleNext(); else clearTimeout(autoTimer);
  } else if (e.code === 'ArrowRight') {
    e.preventDefault(); clearTimeout(autoTimer);
    showSlide((currentSlide+1) % slides.length);
    if (!paused) scheduleNext();
  } else if (e.code === 'ArrowLeft') {
    e.preventDefault(); clearTimeout(autoTimer);
    showSlide((currentSlide-1+slides.length) % slides.length);
    if (!paused) scheduleNext();
  }
});
