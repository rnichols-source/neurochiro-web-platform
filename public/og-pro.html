<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px;
    background: #16222D;
    font-family: system-ui, -apple-system, sans-serif;
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .glow {
    position: absolute; width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(214,104,41,0.12) 0%, transparent 70%);
    bottom: -150px; left: -100px;
  }
  .content { text-align: left; z-index: 1; padding: 80px; max-width: 100%; }
  .logo { font-size: 20px; font-weight: 900; color: #F3EFE9; letter-spacing: 2px; margin-bottom: 40px; }
  .logo span { color: #D66829; }
  h1 { font-size: 52px; font-weight: 900; color: #F3EFE9; line-height: 1.1; margin-bottom: 24px; letter-spacing: -0.03em; max-width: 700px; }
  .math { display: flex; gap: 60px; margin-top: 36px; }
  .math-item .num { font-size: 48px; font-weight: 900; color: #D66829; letter-spacing: -0.03em; }
  .math-item .label { font-size: 16px; color: #93A0AC; margin-top: 4px; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="content">
    <div class="logo">NEURO<span>CHIRO</span> PRO</div>
    <h1>Get found by the patients already looking for you.</h1>
    <div class="math">
      <div class="math-item">
        <div class="num">$99</div>
        <div class="label">per month</div>
      </div>
      <div class="math-item">
        <div class="num">80-100</div>
        <div class="label">clips from 2 interviews</div>
      </div>
      <div class="math-item">
        <div class="num">12 mo</div>
        <div class="label">of content posted for you</div>
      </div>
    </div>
  </div>
</body>
</html>
