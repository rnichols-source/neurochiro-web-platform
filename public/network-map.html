<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>NeuroChiro Network Map</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" integrity="sha384-MinO0mNliZ3vwppuPOUnGa+iq619pfMhLVUXfC4LHwSCvF9H+6P/KO4Q7qBOYV5V" crossorigin="anonymous" />
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js" integrity="sha384-SYKAG6cglRMN0RVvhNeBY0r3FYKNOJtznwA0v7B5Vp9tr31xAHsZC0DqkQ/pZDmj" crossorigin="anonymous"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; height: 100%; }

        /* Apple Maps style popups */
        .maplibregl-popup { max-width: 280px !important; z-index: 10; }
        .maplibregl-popup-content {
            background: rgba(255,255,255,0.98); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: 16px; padding: 0;
            box-shadow: 0 8px 32px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.08);
            border: 1px solid rgba(0,0,0,0.06); overflow: hidden;
        }
        .maplibregl-popup-close-button {
            font-size: 20px; color: #999; right: 8px; top: 8px; width: 28px; height: 28px;
            display: flex; align-items: center; justify-content: center; border-radius: 50%; background: rgba(0,0,0,0.05);
        }
        .maplibregl-popup-close-button:hover { background: rgba(0,0,0,0.1); }
        .maplibregl-popup-tip { border-top-color: rgba(255,255,255,0.98) !important; }
        .popup-card { padding: 16px; }
        .popup-card .doctor-name { font-size: 16px; font-weight: 700; color: #1E2D3B; margin-bottom: 2px; }
        .popup-card .clinic-name { font-size: 13px; color: #666; margin-bottom: 4px; }
        .popup-card .location { font-size: 12px; color: #999; display: flex; align-items: center; gap: 4px; margin-bottom: 12px; }
        .popup-card .view-btn {
            display: block; width: 100%; padding: 10px 16px; background: #D66829; color: white;
            border: none; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer;
            text-align: center; text-decoration: none; transition: background 0.2s;
        }
        .popup-card .view-btn:hover { background: #c05a22; }

        .maplibregl-ctrl-bottom-left, .maplibregl-ctrl-bottom-right { display: none !important; }
        .maplibregl-ctrl-group {
            background: rgba(255,255,255,0.92) !important; backdrop-filter: blur(20px) !important;
            border-radius: 12px !important;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08), 0 0 0 0.5px rgba(0,0,0,0.06) !important;
            border: none !important; overflow: hidden !important;
        }
        .maplibregl-ctrl-group button { width: 44px !important; height: 44px !important; }
        .maplibregl-ctrl-group button + button { border-top: 1px solid rgba(0,0,0,0.06) !important; }
    </style>
</head>
<body>
<div id="map"></div>
<script>
(function() {
    var activePopup = null;
    var selectedDoctorId = null;
    var pendingFeatures = null;
    var layersReady = false;
    var patientMobile = window.innerWidth < 1024;
    var pendingUser = null;
    window.__ncMapFeatureCount = 0;
    var seminarMode = /(?:\?|&)layer=seminar(?:&|$)/.test(window.location.search);

    function escapeHtml(value) {
        return String(value == null ? '' : value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    var mapOptions = {
        container: 'map',
        style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
        center: [-98, 38],
        zoom: 4,
        maxPitch: 60,
        attributionControl: false
    };
    if (seminarMode) mapOptions.cooperativeGestures = false;
    var map = new maplibregl.Map(mapOptions);
    window.__ncMap = map;

    // Only show zoom controls on desktop — mobile uses pinch to zoom like Apple Maps
    var isMobile = window.innerWidth < 1024;
    if (!isMobile) {
        map.addControl(new maplibregl.NavigationControl({ showCompass: true }), 'top-right');
    }
    map.addControl(new maplibregl.GeolocateControl({
        positionOptions: { enableHighAccuracy: true },
        trackUserLocation: false
    }), 'top-right');

    // ── Popup helper ──
    function createPopupHtml(props) {
        var name = escapeHtml(props.name || 'Specialist');
        var clinic = escapeHtml(props.clinic || '');
        var loc = escapeHtml([props.city || '', props.state || ''].filter(Boolean).join(', '));
        var slug = escapeHtml(props.slug || '');
        var html = '<div class="popup-card">';
        html += '<div class="doctor-name">' + name + '</div>';
        if (clinic) html += '<div class="clinic-name">' + clinic + '</div>';
        if (loc) html += '<div class="location"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#D66829" stroke-width="2.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>' + loc + '</div>';
        if (slug) html += '<a class="view-btn" href="/directory/' + slug + '" target="_top">View Profile</a>';
        html += '</div>';
        return html;
    }

    function createSeminarPopupHtml(props) {
        var title = escapeHtml(props.title || props.name || 'Seminar');
        var dates = escapeHtml(props.dateLabel || '');
        var city = escapeHtml(props.cityLabel || props.city || '');
        var price = escapeHtml(props.priceLabel || '');
        var ce = props.ceHours ? escapeHtml(String(props.ceHours)) + ' CE' : '';
        var slug = String(props.slug || '');
        var html = '<div class="popup-card">';
        html += '<div class="doctor-name">' + title + '</div>';
        if (dates) html += '<div class="clinic-name">' + dates + '</div>';
        if (city) html += '<div class="location">' + city + '</div>';
        if (price || ce) html += '<div class="clinic-name">' + [price, ce].filter(Boolean).join(' · ') + '</div>';
        if (/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(slug)) {
            html += '<button type="button" class="view-btn" data-seminar-slug="' + escapeHtml(slug) + '">View seminar</button>';
        }
        html += '</div>';
        return html;
    }

    document.addEventListener('click', function(event) {
        var target = event.target && event.target.closest ? event.target.closest('[data-seminar-slug]') : null;
        if (!target) return;
        event.preventDefault();
        var slug = target.getAttribute('data-seminar-slug') || '';
        if (!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(slug)) return;
        window.parent.postMessage({ type: 'open-seminar', slug: slug }, window.location.origin);
    });

    function paintSelection(id) {
        if (!map.getLayer('doctor-dots')) return;
        var radius = id
            ? ['case', ['==', ['get', 'doctorId'], String(id)], 16, 12]
            : 12;
        var stroke = id
            ? ['case', ['==', ['get', 'doctorId'], String(id)], 4, 2]
            : 2;
        map.setPaintProperty('doctor-dots', 'circle-radius', radius);
        map.setPaintProperty('doctor-dots', 'circle-stroke-width', stroke);
    }

    // ── Setup GL layers (called once on map load) ──
    function setupLayers() {
        map.addSource('doctors', {
            type: 'geojson',
            data: { type: 'FeatureCollection', features: [] },
            cluster: true,
            clusterRadius: 50,
            clusterMaxZoom: 14
        });
        map.addSource('user', {
            type: 'geojson',
            data: { type: 'FeatureCollection', features: [] }
        });

        map.addLayer({
            id: 'clusters',
            type: 'circle',
            source: 'doctors',
            filter: ['has', 'point_count'],
            paint: {
                'circle-color': '#D66829',
                'circle-radius': ['step', ['get', 'point_count'], 18, 10, 22, 50, 28],
                'circle-stroke-width': 3,
                'circle-stroke-color': '#ffffff'
            }
        });
        try {
            map.addLayer({
                id: 'cluster-count',
                type: 'symbol',
                source: 'doctors',
                filter: ['has', 'point_count'],
                layout: {
                    'text-field': '{point_count_abbreviated}',
                    'text-size': 13,
                    'text-font': ['Open Sans Regular', 'Arial Unicode MS Regular']
                },
                paint: { 'text-color': '#ffffff' }
            });
        } catch (err) {
            console.error('[MAP] cluster labels skipped', err);
        }

        // Visual pin is at least 24px across. The hit layer below is 44px.
        map.addLayer({
            id: 'doctor-dots',
            type: 'circle',
            source: 'doctors',
            filter: ['!', ['has', 'point_count']],
            paint: {
                'circle-color': ['case', ['==', ['get', 'kind'], 'seminar'], '#D66829', '#D66829'],
                'circle-radius': ['case', ['==', ['get', 'kind'], 'seminar'], 14, 12],
                'circle-stroke-width': ['case', ['==', ['get', 'kind'], 'seminar'], 3, 2],
                'circle-stroke-color': ['case', ['==', ['get', 'kind'], 'seminar'], '#1E2D3B', '#ffffff']
            }
        });
        map.addLayer({
            id: 'doctor-hit',
            type: 'circle',
            source: 'doctors',
            filter: ['!', ['has', 'point_count']],
            paint: {
                'circle-radius': 22,
                'circle-color': '#D66829',
                'circle-opacity': 0
            }
        });
        if (pendingUser) {
            map.getSource('user').setData({ type: 'FeatureCollection', features: pendingUser });
            pendingUser = null;
        }
        map.addLayer({
            id: 'user-dot',
            type: 'circle',
            source: 'user',
            paint: {
                'circle-radius': 8,
                'circle-color': '#3B82F6',
                'circle-stroke-width': 3,
                'circle-stroke-color': '#ffffff'
            }
        });

        layersReady = true;
        console.log('[MAP] Layers ready, source added');

        // ── Interactions ──

        function openDoctor(feature) {
            var coords = feature.geometry.coordinates.slice();
            var props = feature.properties || {};
            var isSeminar = props.kind === 'seminar';
            selectedDoctorId = props.doctorId;
            paintSelection(selectedDoctorId);
            if (isSeminar || !patientMobile) {
                if (activePopup) activePopup.remove();
                activePopup = new maplibregl.Popup({ offset: 14, closeButton: true, closeOnClick: true, maxWidth: '280px', focusAfterOpen: false })
                    .setLngLat(coords)
                    .setHTML(isSeminar ? createSeminarPopupHtml(props) : createPopupHtml(props))
                    .addTo(map);
                activePopup.on('close', function() { activePopup = null; });
            }
            window.parent.postMessage({
                type: 'marker-click',
                data: {
                    doctorId: props.doctorId,
                    name: props.name,
                    slug: props.slug,
                    clinic: props.clinic,
                    city: props.city,
                    state: props.state,
                    photo_url: props.photo_url || ''
                }
            }, window.location.origin);
        }

        map.on('click', 'doctor-hit', function(e) {
            if (!e.features || !e.features.length) return;
            openDoctor(e.features[0]);
        });
        map.on('click', 'clusters', function(e) {
            var features = map.queryRenderedFeatures(e.point, { layers: ['clusters'] });
            if (!features.length) return;
            var clusterId = features[0].properties.cluster_id;
            var center = features[0].geometry.coordinates;
            map.getSource('doctors').getClusterExpansionZoom(clusterId, function(err, zoom) {
                if (err) return;
                map.easeTo({ center: center, zoom: zoom });
            });
        });

        map.on('click', function(e) {
            var hits = map.queryRenderedFeatures(e.point, { layers: ['doctor-hit', 'clusters'] });
            if (hits.length === 0 && selectedDoctorId) {
                selectedDoctorId = null;
                paintSelection(null);
                if (activePopup) { activePopup.remove(); activePopup = null; }
                window.parent.postMessage({ type: 'marker-deselect' }, window.location.origin);
            }
        });

        ['doctor-hit', 'clusters'].forEach(function(layer) {
            map.on('mouseenter', layer, function() { map.getCanvas().style.cursor = 'pointer'; });
            map.on('mouseleave', layer, function() { map.getCanvas().style.cursor = ''; });
        });

        map.on('moveend', function(e) {
            if (!e.originalEvent) return;
            var b = map.getBounds();
            window.parent.postMessage({
                type: 'map-move',
                bounds: [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()],
                zoom: map.getZoom()
            }, window.location.origin);
        });
    }

    // ── Data management ──
    function setFeatures(features) {
        pendingFeatures = features || [];
        window.__ncMapFeatureCount = pendingFeatures.length;
        window.__ncMapFeatures = pendingFeatures;
        console.log('[MAP] setFeatures called with', pendingFeatures.length, 'features');
        if (!layersReady) {
            console.log('[MAP] Layers not ready, features queued');
            return;
        }
        if (pendingFeatures.length === 0) {
            if (activePopup) { activePopup.remove(); activePopup = null; }
            window.parent.postMessage({ type: 'map-empty' }, window.location.origin);
        }
        features = pendingFeatures.map(function(f, i) {
            return {
                type: 'Feature',
                id: (f.properties && f.properties.doctorId) || String(i),
                geometry: f.geometry,
                properties: f.properties || {}
            };
        });
        try {
            var source = map.getSource('doctors');
            if (source) {
                source.setData({ type: 'FeatureCollection', features: features });
                console.log('[MAP] Source data updated');
            } else {
                console.error('[MAP] Source "doctors" not found');
            }
        } catch (err) {
            console.error('[MAP] setData error:', err);
        }
    }

    function isSeminarFit(features) {
        return seminarMode || (features[0] && features[0].properties && features[0].properties.kind === 'seminar');
    }

    function fitToFeatures(features) {
        if (!features || features.length === 0) return;
        var seminarFit = isSeminarFit(features);
        if (features.length === 1) {
            map.flyTo({ center: features[0].geometry.coordinates, zoom: seminarFit ? 8 : 13, duration: 1200, essential: true });
            return;
        }
        var bounds = new maplibregl.LngLatBounds();
        features.forEach(function(f) { bounds.extend(f.geometry.coordinates); });
        if (seminarFit) {
            map.fitBounds(bounds, { padding: 40, maxZoom: 9, duration: 1200 });
            return;
        }
        map.fitBounds(bounds, { padding: { top: 80, bottom: 80, left: 60, right: 60 }, maxZoom: 14, duration: 1200 });
    }

    function flyToDoctor(doctorId) {
        if (!pendingFeatures) return;
        var id = String(doctorId);
        for (var i = 0; i < pendingFeatures.length; i++) {
            var f = pendingFeatures[i];
            if (f.properties && String(f.properties.doctorId) === id) {
                selectedDoctorId = id;
                var coords = f.geometry.coordinates;
                map.flyTo({ center: coords, zoom: Math.max(map.getZoom(), 13), duration: 800, essential: true });

                if (!patientMobile) {
                    if (activePopup) activePopup.remove();
                    activePopup = new maplibregl.Popup({ offset: 14, closeButton: true, closeOnClick: true, maxWidth: '280px', focusAfterOpen: false })
                        .setLngLat(coords).setHTML(createPopupHtml(f.properties)).addTo(map);
                    activePopup.on('close', function() { activePopup = null; });
                }

                window.parent.postMessage({ type: 'marker-click', data: f.properties }, window.location.origin);
                return;
            }
        }
    }

    // ── Self-load doctors from API ──
    function loadDoctors() {
        console.log('[MAP] loadDoctors called');
        fetch('/api/directory/search?q=&limit=500')
            .then(function(res) { return res.json(); })
            .then(function(data) {
                var doctors = data.doctors || [];
                console.log('[MAP] API returned', doctors.length, 'doctors');
                var features = [];
                doctors.forEach(function(d) {
                    var lat = Number(d.latitude);
                    var lng = Number(d.longitude);
                    if (!lat || !lng || isNaN(lat) || isNaN(lng)) return;
                    if (Math.abs(lat) > 90 || Math.abs(lng) > 180) return;
                    features.push({
                        type: 'Feature',
                        geometry: { type: 'Point', coordinates: [lng, lat] },
                        properties: {
                            doctorId: String(d.id),
                            name: 'Dr. ' + (d.first_name || '') + ' ' + (d.last_name || ''),
                            slug: d.slug || '',
                            clinic: d.clinic_name || '',
                            city: d.city || '',
                            state: d.state || '',
                            photo_url: d.photo_url || '',
                            matched: 1
                        }
                    });
                });
                console.log('[MAP] Built', features.length, 'valid features');
                setFeatures(features);
                fitToFeatures(features);
            })
            .catch(function(err) {
                console.error('[MAP] Load failed:', err);
                window.parent.postMessage({ type: 'map-error', error: 'Failed to load doctors' }, window.location.origin);
            });
    }

    function reportReady() {
        window.parent.postMessage({ type: 'map-ready' }, window.location.origin);
    }

    // ── Map load ──
    map.on('load', function() {
        console.log('[MAP] Map loaded');
        setupLayers();
        reportReady();

        // Push any features that arrived before map was ready
        if (pendingFeatures) {
            console.log('[MAP] Flushing', pendingFeatures.length, 'pending features');
            setFeatures(pendingFeatures);
            if (pendingFeatures.length > 0) fitToFeatures(pendingFeatures);
        }

        // Data is sent by parent via postMessage — no self-loading
    });

    // ── PostMessage from parent ──
    window.addEventListener('message', function(e) {
        var d = e.data;
        if (!d || !d.type) return;

        switch (d.type) {
            case 'is-ready':
                reportReady();
                break;

            case 'force-raw-markers':
                var features = d.data || [];
                console.log('[MAP] Received force-raw-markers with', features.length, 'features');
                setFeatures(features);
                if (features.length > 0) fitToFeatures(features);
                break;

            case 'update-markers':
                var updatedFeatures = d.data || [];
                console.log('[MAP] Received update-markers with', updatedFeatures.length, 'features');
                setFeatures(updatedFeatures);
                break;

            case 'set-mobile':
                patientMobile = !!d.mobile;
                if (patientMobile && activePopup) { activePopup.remove(); activePopup = null; }
                break;

            case 'set-user-location':
                var userSource = map.getSource('user');
                var userFeatures = [];
                if (d.lat != null && d.lng != null && !isNaN(Number(d.lat)) && !isNaN(Number(d.lng))) {
                    userFeatures.push({
                        type: 'Feature',
                        geometry: { type: 'Point', coordinates: [Number(d.lng), Number(d.lat)] },
                        properties: {}
                    });
                }
                if (userSource) userSource.setData({ type: 'FeatureCollection', features: userFeatures });
                else pendingUser = userFeatures;
                break;

            case 'highlight-marker':
                selectedDoctorId = d.doctorId || null;
                paintSelection(selectedDoctorId);
                break;

            case 'set-view':
                if (d.center && d.center[0] !== undefined) {
                    map.flyTo({ center: [d.center[0], d.center[1]], zoom: d.zoom, duration: 1200, essential: true });
                }
                break;

            case 'select-marker':
                flyToDoctor(d.doctorId);
                break;

            case 'focus-seminar':
                var focusSlug = String(d.slug || '');
                var focusList = pendingFeatures || [];
                for (var fi = 0; fi < focusList.length; fi++) {
                    var focusFeature = focusList[fi];
                    if (focusFeature.properties && focusFeature.properties.kind === 'seminar' && focusFeature.properties.slug === focusSlug) {
                        openDoctor(focusFeature);
                        map.flyTo({ center: focusFeature.geometry.coordinates, zoom: Math.max(map.getZoom(), 8), duration: 600, essential: true });
                        break;
                    }
                }
                break;

            case 'deselect-marker':
                selectedDoctorId = null;
                if (activePopup) { activePopup.remove(); activePopup = null; }
                break;
        }
    });
})();
</script>
</body>
</html>
